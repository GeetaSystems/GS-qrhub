<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GS-QRHub — Geeta Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--ink:#0a0a0f;--ink-2:#1c1c26;--ink-3:#2e2e3e;--muted:#6b6b8a;--subtle:#9898b8;--line:rgba(255,255,255,.07);--paper:#f4f3ef;--accent:#00e5a0;--accent-2:#7c5cfc;--warn:#ff5f57;--glow:rgba(0,229,160,.18);--radius:10px;--font-head:'Syne',sans-serif;--font-mono:'Space Mono',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-mono);background:var(--ink);color:var(--paper);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 24px}
    header{padding:40px 0 32px;border-bottom:1px solid var(--line)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
    .logo{display:flex;align-items:center;gap:14px}
    .logo-mark{width:44px;height:44px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
    .logo-text{font-family:var(--font-head);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;color:#fff}
    .logo-sub{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:1px}
    .header-nav{display:flex;gap:8px;align-items:center}
    .nav-link{color:var(--subtle);font-size:.7rem;letter-spacing:.06em;text-decoration:none;padding:6px 12px;border:1px solid var(--ink-3);border-radius:6px;transition:all .15s}
    .nav-link:hover{color:var(--accent);border-color:var(--accent)}
    .status-pill{display:flex;align-items:center;gap:8px;background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.2);border-radius:100px;padding:6px 14px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
    .type-nav{padding:32px 0 0;display:flex;flex-direction:column;gap:20px}
    .type-nav-label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .type-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .type-tab{background:none;border:1px solid var(--ink-3);border-radius:6px;color:var(--subtle);font-family:var(--font-mono);font-size:.72rem;letter-spacing:.04em;padding:6px 12px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .type-tab:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}
    .type-tab.active{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
    .type-section-label{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-right:4px;white-space:nowrap}
    .main-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;padding:32px 0 60px;align-items:start}
    @media(max-width:900px){.main-grid{grid-template-columns:1fr}}
    .form-panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
    .panel-title{font-family:var(--font-head);font-weight:700;font-size:.85rem;color:var(--paper);display:flex;align-items:center;gap:8px}
    .badge{font-family:var(--font-mono);font-size:.6rem;font-weight:400;background:var(--accent);color:var(--ink);padding:2px 7px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
    .form-body{padding:24px 20px;display:flex;flex-direction:column;gap:18px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    label .req{color:var(--accent);margin-left:3px}
    input,select,textarea{background:var(--ink);border:1px solid var(--ink-3);border-radius:6px;color:var(--paper);font-family:var(--font-mono);font-size:.8rem;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
    input::placeholder,textarea::placeholder{color:var(--ink-3)}
    select option{background:var(--ink-2)}
    textarea{resize:vertical;min-height:72px}
    .btn-generate{width:100%;background:var(--accent);border:none;border-radius:7px;color:var(--ink);cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:.9rem;letter-spacing:.04em;padding:13px 20px;transition:transform .12s,box-shadow .12s}
    .btn-generate:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,229,160,.35)}
    .btn-generate.loading{opacity:.7;pointer-events:none}
    .url-preview{background:var(--ink);border:1px solid var(--ink-3);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:40px}
    .url-preview-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex-shrink:0}
    .url-preview-text{font-size:.68rem;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .output-panel{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
    .qr-display{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:300px;justify-content:center}
    .qr-placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
    .qr-placeholder-icon{width:72px;height:72px;border:2px dashed var(--ink-3);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
    .qr-placeholder-text{font-size:.7rem;color:var(--muted);line-height:1.6}
    #qr-output{width:100%;display:flex;justify-content:center;align-items:center}
    #qr-output svg{max-width:100%;height:auto;border-radius:6px}
    .qr-meta{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .qr-type-tag{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(124,92,252,.15);color:var(--accent-2);border:1px solid rgba(124,92,252,.25);padding:3px 8px;border-radius:4px}
    .btn-download{background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.25);border-radius:6px;color:var(--accent);cursor:pointer;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;padding:6px 12px;text-transform:uppercase;transition:all .15s}
    .btn-download:hover{background:rgba(0,229,160,.2);border-color:var(--accent)}
    .error-bar{background:rgba(255,95,87,.1);border:1px solid rgba(255,95,87,.25);border-radius:7px;color:var(--warn);font-size:.75rem;line-height:1.5;padding:10px 14px;display:none}
    .error-bar.visible{display:block}
    .options-panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .options-toggle{background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;padding:14px 20px;text-transform:uppercase;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:color .15s}
    .options-toggle:hover{color:var(--paper)}
    .options-toggle .arrow{transition:transform .2s}
    .options-toggle.open .arrow{transform:rotate(180deg)}
    .options-body{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s}
    .options-body.open{max-height:500px;padding:0 20px 20px}
    .color-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .color-input-wrap{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--ink-3);border-radius:6px;padding:4px 12px 4px 8px}
    .color-input-wrap:focus-within{border-color:var(--accent)}
    .color-swatch{width:22px;height:22px;border-radius:4px;border:none;cursor:pointer;padding:0;background:none;flex-shrink:0}
    .color-hex{background:none;border:none;color:var(--paper);font-family:var(--font-mono);font-size:.78rem;outline:none;width:100%;padding:7px 0}
    .spinner{width:32px;height:32px;border:2px solid var(--ink-3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{border-top:1px solid var(--line);padding:20px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .footer-text{font-size:.65rem;letter-spacing:.08em;color:var(--muted)}
    .footer-links{display:flex;gap:16px}
    .footer-links a{color:var(--subtle);font-size:.65rem;text-decoration:none;transition:color .15s}
    .footer-links a:hover{color:var(--accent)}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .35s ease forwards}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 26 26" fill="none" width="26" height="26"><rect x="2" y="2" width="9" height="9" rx="1.5" fill="#0a0a0f"/><rect x="15" y="2" width="9" height="9" rx="1.5" fill="#0a0a0f"/><rect x="2" y="15" width="9" height="9" rx="1.5" fill="#0a0a0f"/><rect x="15" y="15" width="4" height="4" rx="1" fill="#0a0a0f"/><rect x="21" y="15" width="3" height="3" rx=".8" fill="#0a0a0f"/><rect x="15" y="21" width="3" height="3" rx=".8" fill="#0a0a0f"/><rect x="20" y="20" width="4" height="4" rx="1" fill="#0a0a0f"/></svg>
        </div>
        <div><div class="logo-text">GS-QRHub</div><div class="logo-sub">Geeta Systems</div></div>
      </div>
      <div class="header-nav">
        <a href="/docs" class="nav-link">Docs</a>
        <a href="/health" class="nav-link">Health</a>
        <div class="status-pill"><span class="status-dot"></span>Online</div>
      </div>
    </div>
  </header>
  <div class="type-nav">
    <div class="type-nav-label">Select Type</div>
    <div class="type-tabs" id="type-tabs">
      <span class="type-section-label">QR —</span>
      <button class="type-tab active" data-type="qr">qr</button>
      <button class="type-tab" data-type="wifi">wifi</button>
      <button class="type-tab" data-type="vcard">vcard</button>
      <button class="type-tab" data-type="email">email</button>
      <button class="type-tab" data-type="sms">sms</button>
      <button class="type-tab" data-type="phone">phone</button>
      <button class="type-tab" data-type="geo">geo</button>
      <button class="type-tab" data-type="whatsapp">whatsapp</button>
      <button class="type-tab" data-type="event">event</button>
      <button class="type-tab" data-type="crypto">crypto</button>
      <button class="type-tab" data-type="otp">otp</button>
      <span class="type-section-label" style="margin-left:8px">Barcode —</span>
      <button class="type-tab" data-type="barcode">barcode</button>
    </div>
  </div>
  <div class="main-grid">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-panel">
        <div class="panel-header"><div class="panel-title">Parameters <span class="badge" id="active-type-badge">qr</span></div></div>
        <div class="form-body" id="form-body"></div>
      </div>
      <div class="options-panel">
        <button class="options-toggle" id="options-toggle">Render Options <i class="arrow">▾</i></button>
        <div class="options-body" id="options-body">
          <div style="display:flex;flex-direction:column;gap:16px;padding-top:4px;">
            <div class="field-row">
              <div class="field"><label>Size (px)</label><input type="number" id="opt-size" placeholder="300" min="50" max="2000" value="300"/></div>
              <div class="field"><label>Margin</label><input type="number" id="opt-margin" placeholder="4" min="0" max="20" value="4"/></div>
            </div>
            <div class="color-row">
              <div class="field"><label>Dark Color</label><div class="color-input-wrap"><input type="color" class="color-swatch" id="opt-dark-swatch" value="#000000"/><input type="text" class="color-hex" id="opt-dark-hex" value="000000" maxlength="6"/></div></div>
              <div class="field"><label>Light Color</label><div class="color-input-wrap"><input type="color" class="color-swatch" id="opt-light-swatch" value="#ffffff"/><input type="text" class="color-hex" id="opt-light-hex" value="ffffff" maxlength="6"/></div></div>
            </div>
            <div class="field" id="ecc-field"><label>Error Correction (QR only)</label><select id="opt-ecc"><option value="L">L — Low</option><option value="M" selected>M — Medium</option><option value="Q">Q — Quartile</option><option value="H">H — High</option></select></div>
          </div>
        </div>
      </div>
      <div class="url-preview"><span class="url-preview-label">URL</span><span class="url-preview-text" id="url-preview-text">—</span></div>
    </div>
    <div class="output-panel">
      <div class="qr-display">
        <div class="qr-placeholder" id="qr-placeholder">
          <div class="qr-placeholder-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h2v2h-2zM18 14h3M14 18v3M18 18h3v3h-3z"/></svg></div>
          <div class="qr-placeholder-text">Fill in the form<br/>and click Generate</div>
        </div>
        <div id="qr-output" style="display:none;width:100%;"></div>
        <div class="spinner" id="qr-spinner" style="display:none;"></div>
      </div>
      <div class="error-bar" id="error-bar"></div>
      <div id="qr-actions" style="display:none;"><div class="qr-meta"><span class="qr-type-tag" id="qr-type-tag">—</span><button class="btn-download" id="btn-download">↓ Download SVG</button></div></div>
    </div>
  </div>
  <footer>
    <div class="footer-text">© 2026 Geeta Systems — GS-QRHub v1.0.0</div>
    <div class="footer-links"><a href="/docs">docs</a><a href="/health">health</a><a href="/info">api info</a></div>
  </footer>
</div>
<script>
const FORMS={qr:{fields:[{id:'text',label:'Text or URL',type:'input',ph:'Hello World or https://example.com',req:true}]},wifi:{fields:[{id:'ssid',label:'SSID',type:'input',ph:'OfficeWifi',req:true},{id:'password',label:'Password',type:'input',ph:'secret123'},{id:'security',label:'Security',type:'select',opts:['WPA','WEP','nopass'],def:'WPA'},{id:'hidden',label:'Hidden',type:'select',opts:['false','true'],def:'false'}]},vcard:{fields:[{id:'name',label:'Full Name',type:'input',ph:'John Doe',req:true},{id:'phone',label:'Phone',type:'input',ph:'+919876543210'},{id:'email',label:'Email',type:'input',ph:'john@example.com'},{id:'org',label:'Organisation',type:'input',ph:'ACME Corp'},{id:'title',label:'Job Title',type:'input',ph:'Engineer'},{id:'url',label:'Website',type:'input',ph:'https://example.com'},{id:'address',label:'Address',type:'input',ph:'123 Main St'}]},email:{fields:[{id:'to',label:'To',type:'input',ph:'john@example.com',req:true},{id:'subject',label:'Subject',type:'input',ph:'Hello!'},{id:'body',label:'Body',type:'textarea',ph:'Email body...'}]},sms:{fields:[{id:'phone',label:'Phone',type:'input',ph:'9876543210',req:true},{id:'message',label:'Message',type:'textarea',ph:'Your message...'}]},phone:{fields:[{id:'number',label:'Phone Number',type:'input',ph:'+919876543210',req:true}]},geo:{fields:[{id:'lat',label:'Latitude',type:'input',ph:'28.6139',req:true},{id:'lng',label:'Longitude',type:'input',ph:'77.2090',req:true}]},whatsapp:{fields:[{id:'phone',label:'Phone (no +)',type:'input',ph:'919876543210',req:true},{id:'message',label:'Pre-fill Text',type:'textarea',ph:'Hello!'}]},event:{fields:[{id:'title',label:'Event Title',type:'input',ph:'Team Meeting',req:true},{id:'start',label:'Start (ISO 8601)',type:'input',ph:'2026-06-01T10:00:00Z',req:true},{id:'end',label:'End (ISO 8601)',type:'input',ph:'2026-06-01T11:00:00Z'},{id:'location',label:'Location',type:'input',ph:'Conference Room A'},{id:'description',label:'Description',type:'input',ph:'Quarterly review'}]},crypto:{fields:[{id:'coin',label:'Coin',type:'input',ph:'bitcoin',req:true},{id:'address',label:'Address',type:'input',ph:'Wallet address',req:true},{id:'amount',label:'Amount',type:'input',ph:'0.001'},{id:'label',label:'Label',type:'input',ph:'Payment'},{id:'message',label:'Note',type:'input',ph:'Invoice #123'}]},otp:{fields:[{id:'issuer',label:'Issuer',type:'input',ph:'MyApp',req:true},{id:'account',label:'Account',type:'input',ph:'user@example.com',req:true},{id:'secret',label:'Secret (Base32)',type:'input',ph:'JBSWY3DPEHPK3PXP',req:true},{id:'algorithm',label:'Algorithm',type:'select',opts:['SHA1','SHA256'],def:'SHA1'},{id:'digits',label:'Digits',type:'select',opts:['6','8'],def:'6'},{id:'period',label:'Period (s)',type:'input',ph:'30'}]},barcode:{fields:[{id:'text',label:'Data',type:'input',ph:'ABC123',req:true},{id:'format',label:'Format',type:'select',opts:['code128','code39','ean13','ean8','upca','upce','interleaved2of5','gs1-128','pdf417','datamatrix'],def:'code128'}]}};
let cur='qr',lastSvg=null;
const $=id=>document.getElementById(id);
function rf(t){const d=FORMS[t];$('active-type-badge').textContent=t;$('form-body').innerHTML='';d.fields.forEach(f=>{const w=document.createElement('div');w.className='field';const l=document.createElement('label');l.setAttribute('for','f-'+f.id);l.innerHTML=f.label+(f.req?'<span class="req">*</span>':'');w.appendChild(l);let el;if(f.type==='select'){el=document.createElement('select');(f.opts||[]).forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===f.def)op.selected=true;el.appendChild(op);});}else if(f.type==='textarea'){el=document.createElement('textarea');el.placeholder=f.ph||'';}else{el=document.createElement('input');el.type='text';el.placeholder=f.ph||'';}el.id='f-'+f.id;el.addEventListener('input',up);el.addEventListener('change',up);w.appendChild(el);$('form-body').appendChild(w);});const bw=document.createElement('div');bw.style.paddingTop='4px';const b=document.createElement('button');b.className='btn-generate';b.textContent='Generate';b.id='btn-generate';b.addEventListener('click',gen);bw.appendChild(b);$('form-body').appendChild(bw);$('ecc-field').style.display=t==='barcode'?'none':'';up();}
function bp(){const p=new URLSearchParams();p.set('type',cur);FORMS[cur].fields.forEach(f=>{const el=$('f-'+f.id);if(!el)return;const v=el.value.trim();if(v)p.set(f.id,v);});const s=$('opt-size').value,m=$('opt-margin').value,dk=$('opt-dark-hex').value.trim(),lk=$('opt-light-hex').value.trim();if(s&&s!=='300')p.set('size',s);if(m&&m!=='4')p.set('margin',m);if(dk&&dk!=='000000')p.set('darkColor',dk);if(lk&&lk!=='ffffff')p.set('lightColor',lk);const ecc=$('opt-ecc').value;if(ecc&&ecc!=='M')p.set('errorCorrectionLevel',ecc);return p;}
function up(){$('url-preview-text').textContent='/?'+bp().toString();}
async function gen(){const btn=$('btn-generate');btn.classList.add('loading');btn.textContent='Generating…';$('error-bar').classList.remove('visible');$('qr-placeholder').style.display='none';$('qr-output').style.display='none';$('qr-spinner').style.display='block';$('qr-actions').style.display='none';try{const res=await fetch('/?'+bp().toString());const ct=res.headers.get('content-type')||'';if(!res.ok||!ct.includes('svg')){let msg=`Error ${res.status}`;try{const j=await res.json();msg=j.error||msg;}catch{}throw new Error(msg);}const svg=await res.text();lastSvg=svg;$('qr-spinner').style.display='none';$('qr-output').innerHTML=svg;$('qr-output').style.display='flex';$('qr-output').classList.add('fade-in');setTimeout(()=>$('qr-output').classList.remove('fade-in'),400);$('qr-type-tag').textContent=cur.toUpperCase();$('qr-actions').style.display='block';}catch(e){$('qr-spinner').style.display='none';$('qr-placeholder').style.display='flex';$('error-bar').textContent=e.message;$('error-bar').classList.add('visible');}finally{btn.classList.remove('loading');btn.textContent='Generate';}}
$('btn-download').addEventListener('click',()=>{if(!lastSvg)return;const b=new Blob([lastSvg],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`gs-qrhub-${cur}-${Date.now()}.svg`;a.click();URL.revokeObjectURL(a.href);});
$('type-tabs').addEventListener('click',e=>{if(!e.target.matches('.type-tab'))return;document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');cur=e.target.dataset.type;lastSvg=null;$('qr-output').innerHTML='';$('qr-output').style.display='none';$('qr-placeholder').style.display='flex';$('qr-actions').style.display='none';$('error-bar').classList.remove('visible');rf(cur);});
$('options-toggle').addEventListener('click',()=>{const o=$('options-body').classList.toggle('open');$('options-toggle').classList.toggle('open',o);});
$('opt-dark-swatch').addEventListener('input',()=>{$('opt-dark-hex').value=$('opt-dark-swatch').value.replace('#','');up();});
$('opt-dark-hex').addEventListener('input',()=>{if(/^[0-9a-fA-F]{6}$/.test($('opt-dark-hex').value))$('opt-dark-swatch').value='#'+$('opt-dark-hex').value;up();});
$('opt-light-swatch').addEventListener('input',()=>{$('opt-light-hex').value=$('opt-light-swatch').value.replace('#','');up();});
