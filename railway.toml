[build]
builder = "nixpacks"

[deploy]
startCommand = "node src/app.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[[services]]
name = "gs-qrhub"

[services.variables]
NODE_ENV    = "production"
PORT        = "3000"
RATE_LIMIT  = "100"
CORS_ORIGINS = "*"
